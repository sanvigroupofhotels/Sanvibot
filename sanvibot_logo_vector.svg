<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" width="340" height="88" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="340" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="50%" stop-color="#1e1b38"/>
      <stop offset="100%" stop-color="#141622"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="14" y1="14" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="16" x2="320" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="180" y1="20" x2="310" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Self-Contained Adaptive Brand Pill (looks crisp on both Light Mode #ffffff and Dark Mode #17171a) -->
  <rect x="4" y="6" width="332" height="76" rx="24" fill="url(#badgeBg)" stroke="url(#goldGrad)" stroke-width="1.6" stroke-opacity="0.55" filter="url(#softShadow)"/>

  <!-- Left Emblem Squircle -->
  <rect x="16" y="16" width="56" height="56" rx="15" fill="url(#iconBg)" stroke="#fbbf24" stroke-width="1.4" stroke-opacity="0.7"/>

  <!-- Stylized 'S' + Neural Spark Inside Emblem -->
  <path d="M51 29.5C47.5 26.8 40.5 27 37.5 30.2C34.5 33.4 36 38 40.8 40L48.2 43C53 45 54.5 49.6 51.5 52.8C48.5 56 41.5 56.2 38 53.5" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M57 23L58.2 26.2L61.4 27.4L58.2 28.6L57 31.8L55.8 28.6L52.6 27.4L55.8 26.2L57 23Z" fill="#fde68a"/>
  <circle cx="31" cy="56" r="2.3" fill="#818cf8"/>

  <!-- Full Brand Name: "SanviBot" + Subtitle -->
  <text x="88" y="51" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#ffffff">Sanvi</tspan><tspan fill="url(#botGrad)">Bot</tspan>
  </text>
  <text x="90" y="68" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#a1a1aa" letter-spacing="2.2">
    AI INTELLIGENCE
  </text>
</svg>
